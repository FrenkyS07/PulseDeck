<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>PulseDeck</title>
</head>

<body>
    <div class="container-deck">
        <div class="sidebar-deck">
            <nav class="navbar">
                <div class="navbar__logo">
                    <p>PULSE<span>DECK</span></p>
                </div>
                <div class="navbar__items navbar__items--active">
                    <a href="index.html">
                        <img src="img/menu-white.png" alt="Dashboard">
                        <span>Dashboard</span>
                    </a>
                </div>
                <div class="navbar__items">
                    <a href="downloads.html">
                        <img src="img/download-white.png" alt="Downloads">
                        <span>Downloads</span>
                    </a>
                </div>
                <div class="navbar__items">
                    <a href="mediaPlayer.html">
                        <img src="img/youtube.png" alt="Media Player">
                        <span>Media Player</span>
                    </a>
                </div>
                <div class="navbar__items">
                    <a href="storage.html">
                        <img src="img/database.png" alt="Storage">
                        <span>Storage</span>
                    </a>
                </div>
                <div class="navbar__items">
                    <a href="automation.html">
                        <img src="img/automation.png" alt="Automation">
                        <span>Automation</span>
                    </a>
                </div>
                <div class="navbar__items">
                    <a href="setting.html">
                        <img src="img/settings.png" alt="Settings">
                        <span>Settings</span>
                    </a>
                </div>
                <div class="navbar__items items__account">
                    <img src="img/profile-picture.png" alt="default-picture">
                    <span>Admin</span>
                    <!-- 
                    option signout dibuat pakai popout kecil diatas account dengan ada tanda tombol signout
                    buatkan kayak hover
                    -->
                </div>
            </nav>
        </div>
        <div class="main__deck">
            <div class="deck__content deck__content1"></div>
            <div class="deck__content deck__content2"></div>
            <div class="deck__content deck__content3"></div>
            <div class="deck__content deck__content4"></div>
            <div class="deck__content deck__content5"></div>
            <div class="deck__content deck__content6"></div>
            <div class="deck__content deck__content7"></div>
            <div class="deck__content deck__content8"></div>
        </div>
    </div>
    <script src="javascript/app.js"></script>
</body>

</html>
